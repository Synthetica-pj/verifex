<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Signup — Verifex</title>
  <link rel="icon" type="image/png" href="/assets/verifex-logo-brand.png" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body data-page="signup">
  <div class="page-loader" id="pageLoader">
    <div class="loader-spinner"></div>
    <div class="loader-text">Registering Payload...</div>
  </div>
  <canvas id="canvas-bg"></canvas>
  <canvas id="neural-canvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; opacity: 0.4;"></canvas>
  
  <nav class="nav">
    <div class="wrap-full nav-inner">
      <a class="brand" href="/">
        <img src="/assets/verifex-logo-brand.png" alt="Verifex Logo" class="brand-logo" />
        <div class="brand-name">Verifex</div>
      </a>
      <button class="menu-toggle" id="menuToggle">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div class="nav-links" id="navLinks">
        <a class="nav-link" href="/#technology">Technology</a>
        <a class="nav-link" href="/#faqs">FAQs</a>
        <a class="nav-link" href="/dashboard.html">Dashboard</a>
        <!-- Mobile Only Auth Links -->
        <div class="nav-mobile-auth">
          <a href="/login.html" class="mobile-login">Login</a>
        </div>
      </div>
      <div class="nav-actions">
        <button class="theme-toggle" id="themeToggle" title="Toggle Theme" aria-label="Toggle theme">
          <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <div class="user-profile" id="userProfile" style="display: none;">V</div>
      </div>
    </div>
  </nav>

  <main class="auth-container">
    <div class="glass-card auth-card">
      <h1 class="auth-title">Create account</h1>
      <p class="auth-sub">Secure your access to forensic tools.</p>
      
      <form id="signupForm" novalidate>
        <div class="auth-message" id="authMessage"></div>
        <!-- Existing Form ... -->
        <div class="form-group">
          <label class="form-label" for="signupName">Full Name</label>
          <input type="text" class="form-input" id="signupName" placeholder="John Doe" autocomplete="name" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="signupEmail">Email Address</label>
          <input type="email" class="form-input" id="signupEmail" placeholder="name@company.com" autocomplete="email" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="signupPassword">Password</label>
          <div class="password-wrapper">
            <input type="password" class="form-input" id="signupPassword" name="password" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required />
            <button type="button" id="signupTogglePwd" aria-label="Show password" class="password-toggle">Show</button>
          </div>
        </div>
        <button id="signupSubmit" type="submit" class="btn-auth-brand">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="8.5" cy="7" r="4"></circle>
            <line x1="20" y1="8" x2="20" y2="14"></line>
            <line x1="17" y1="11" x2="23" y2="11"></line>
          </svg>
          Create Account
        </button>
        

        
        <div class="auth-divider">OR</div>
        
        <div id="clerk-signup"></div>
        <button type="button" class="btn-google" id="googleAuthBtn">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.47 2.18 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continue with Clerk (Google)
        </button>
        
        <div id="authStatus" style="margin-top: 16px; font-size: 0.85rem; text-align: center;"></div>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/login.html" class="auth-link">Sign in</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="wrap-full footer-content">
      <p>&copy; 2026 Verifex Neural Labs</p>
      <p>Forensic Inference v2.4.0</p>
    </div>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
